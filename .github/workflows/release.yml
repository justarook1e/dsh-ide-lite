name: release

# Publishing is tag-driven: pushing vX.Y.Z publishes that exact version to npm.
# The tag/version agreement gate below is what keeps `package.json` version and
# the git tag from drifting apart — the failure mode the old repo hit, where the
# newest tag (v1.19.0) sat 14 commits behind the shipped code (v1.31.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC: trusted publishing + automatic provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, the floor for trusted publishing, and npm is
      # the CLI that performs the OIDC exchange. The previous setup published with
      # pnpm on Node 22 (npm 10.x) and only warned
      # "[WARN] Skipped OIDC: ERR_PNPM_AUTH_TOKEN_EXCHANGE ... (status code 404)"
      # before falling back to NPM_TOKEN.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg — bump the version and re-tag"
            exit 1
          fi

      - name: Verify the shipped entries exist
        run: |
          for f in host/index.mjs client/dist/client.js cordis.patch.yml; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the tag — npm consumers would get a broken bundle"
              exit 1
            fi
          done
          node -e "
            const p = require('./package.json');
            if (p.private === true) { console.error('::error::package.json is still private'); process.exit(1); }
            if (!p.exports || !p.exports['./client']) { console.error('::error::exports[\"./client\"] is required for the web bundle'); process.exit(1); }
            if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) { console.error('::error::dsh.bundle.patch is required for dsh plugin to activate the layer'); process.exit(1); }
            console.log('manifest ok:', p.name + '@' + p.version);
          "

      # Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived
      # publish credential, so there is NO NPM_TOKEN to hold or rotate. Provenance
      # is generated automatically on that path — do not pass --provenance, and do
      # not set NODE_AUTH_TOKEN (a token would take precedence over OIDC).
      # The workflow filename must match the trusted publisher entry on npmjs.com.
      - name: Publish to npm
        run: npm publish --access public
